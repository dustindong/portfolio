<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Valentine's Cavapoo Wonderland</title>
  <style>
    /* Old school Geocities vibe */
    body {
      margin: 0;
      padding: 0;
      background-color: #ffccff;
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #000080;
    }

    /* Container with dashed border (old school!) */
    .container {
      width: 90%;
      margin: 20px auto;
      border: 5px dashed #ff69b4;
      background-color: #ffffe0;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    /* Marquee banner styling */
    .marquee-banner {
      font-size: 24px;
      color: #ff0000;
      margin: 0;
      padding: 10px 0;
      background-color: #ffff99;
    }

    /* Valentine's Card Style */
    .card {
      background-color: #fff;
      border: 2px solid #ff1493;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
      box-shadow: 5px 5px 5px #888888;
    }

    /* Bigger heart styling with blink animation (simulating <blink>) */
    .heart {
      font-size: 72px;  /* Increased from 48px to 72px */
      color: red;
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Spinning dog images with high z-index and reduced size */
    .dog {
      position: absolute;
      width: 150px; /* Reduced to 50% of the previous 300px size */
      height: auto;
      animation: spin 10s linear infinite;
      z-index: 9999; /* Ensures these images are on top of everything else */
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Positioning multiple dog images */
    .dog1 { top: 10%; left: 5%; }
    .dog2 { top: 20%; right: 5%; }
    .dog3 { bottom: 15%; left: 10%; }
    .dog4 { bottom: 10%; right: 10%; }
    .dog5 { top: 50%; left: 0; }
    .dog6 { top: 0; right: 50%; }

    /* Polaroid-style photo for ling.jpg */
    .polaroid {
      width: 500px;  /* Fixed width */
      background-color: white;
      padding: 10px;
      border: 1px solid #ccc;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
      margin: 20px auto;
    }
    .polaroid img {
      width: 100%;  /* Makes the image fill the polaroid container */
      display: block;
    }

    /* Styling for links and additional text */
    a {
      color: #0000ee;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Old school marquee banner -->
  <marquee behavior="scroll" direction="left" scrollamount="5" class="marquee-banner">
    Welcome to My Valentine's Cavapoo Wonderland! Enjoy the flashing fun and cute pups!
  </marquee>

  <!-- Spinning images of Cavapoo (using waffle.jpg) with reduced size -->
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog1">
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog2">
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog3">
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog4">
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog5">
  <img src="waffle.jpg" alt="Waffle the Cavapoo" class="dog dog6">

  <div class="container">
    <div class="card">
      <div class="heart">❤️</div>
      <h1>Happy Valentine's Day!</h1>
      <p>I hope your day is filled with love, laughter, and lots of adorable Cavapoos!</p>
    </div>

    <!-- Polaroid-style photo -->
    <div class="polaroid">
      <img src="ling.jpg" alt="Polaroid photo of Ling">
    </div>

  </div>

</body>
</html>
